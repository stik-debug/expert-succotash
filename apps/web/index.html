<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' https://api.x.ai https://api.openai.com; media-src 'self' blob:; worker-src 'self';">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#067647" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0f0d" media="(prefers-color-scheme: dark)">
<meta name="description" content="Professional business management and profit intelligence for SMEs — sales, stock, expenses, multi-currency and AI insights">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700&display=swap" rel="stylesheet">
<title>MarginPilot</title>
<style>
:root {
  --em: #0b7a4b;
  --em-hover: #096c42;
  --em-soft: #e8f7ef;
  --em-muted: #9fe0bc;
  --em-deep: #064c2f;
  --gold: #b54708;
  --gold-soft: #fff4e8;
  --bg: #f4f6f5;
  --surface: #ffffff;
  --surface-2: #f0f3f1;
  --surface-3: #e7ece9;
  --tx: #0f172a;
  --tx-2: #334155;
  --mu: #64748b;
  --mu-2: #94a3b8;
  --bd: #e2e8f0;
  --bd-strong: #cbd5e1;
  --bad: #dc2626;
  --bad-soft: #fef2f2;
  --ok: #0b7a4b;
  --warn: #d97706;
  --radius: 14px;
  --radius-sm: 10px;
  --radius-xs: 8px;
  --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", "SF Mono", ui-monospace, Menlo, Consolas, monospace;
  --shadow-xs: 0 1px 2px rgba(15, 23, 42, 0.05);
  --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.04);
  --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08), 0 2px 6px -2px rgba(15, 23, 42, 0.04);
  --shadow-lg: 0 16px 32px -8px rgba(15, 23, 42, 0.12), 0 6px 12px -4px rgba(15, 23, 42, 0.06);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --nav-h: 60px;
  --side-w: 272px;
  --top-h: 60px;
  --content-max: 1080px;
  color-scheme: light;
}
[data-theme="dark"] {
  --em: #34d399;
  --em-hover: #6ee7b7;
  --em-soft: #0c2a1c;
  --em-muted: #146c43;
  --em-deep: #a7f3d0;
  --gold: #fbbf24;
  --gold-soft: #2a1f08;
  --bg: #0b0f0d;
  --surface: #121816;
  --surface-2: #1a211e;
  --surface-3: #232b27;
  --tx: #f8fafc;
  --tx-2: #cbd5e1;
  --mu: #94a3b8;
  --mu-2: #64748b;
  --bd: #24302b;
  --bd-strong: #33443c;
  --bad: #f87171;
  --bad-soft: #3f1515;
  --ok: #34d399;
  --warn: #fbbf24;
  --shadow-xs: 0 1px 2px rgba(0,0,0,.45);
  --shadow-sm: 0 1px 3px rgba(0,0,0,.4);
  --shadow-md: 0 8px 20px rgba(0,0,0,.45);
  --shadow-lg: 0 18px 40px rgba(0,0,0,.55);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; height: 100%; }
body {
  margin: 0; min-height: 100%;
  font-family: var(--font);
  font-size: 14.5px;
  line-height: 1.5;
  background:
    radial-gradient(1200px 500px at 10% -10%, rgba(11,122,75,0.07), transparent 55%),
    radial-gradient(900px 400px at 100% 0%, rgba(15,23,42,0.03), transparent 45%),
    var(--bg);
  color: var(--tx);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  padding-top: var(--safe-t);
}
[data-theme="dark"] body {
  background:
    radial-gradient(1000px 480px at 8% -12%, rgba(52,211,153,0.08), transparent 50%),
    var(--bg);
}
h1,h2,h3,h4 { margin: 0 0 0.3em; font-weight: 650; letter-spacing: -0.03em; line-height: 1.25; color: var(--tx); }
h1 { font-size: 1.5rem; letter-spacing: -0.035em; font-weight: 700; }
h2 { font-size: 1.125rem; }
h3 { font-size: 0.95rem; font-weight: 650; }
p { margin: 0 0 0.55em; }
a { color: var(--em); text-decoration: none; }
a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; padding: 0; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
.muted { color: var(--mu); }
.ok { color: var(--ok); }
.bad { color: var(--bad); }
.est { color: var(--tx-2); }

/* Layout */
.app-shell { display: flex; min-height: 100dvh; }
.sidebar {
  width: var(--side-w);
  flex-shrink: 0;
  background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
  border-right: 1px solid var(--bd);
  display: none;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100dvh;
  padding: 18px 14px 16px;
  z-index: 40;
}
@media (min-width: 960px) { .sidebar { display: flex; } }
.brand {
  display: flex; align-items: center; gap: 10px;
  padding: 6px 10px 18px;
  color: var(--em);
  font-weight: 750;
  font-size: 1.05rem;
  letter-spacing: -0.03em;
}
.brand svg { flex-shrink: 0; filter: drop-shadow(0 2px 6px rgba(11,122,75,0.25)); }
.brand-text { color: var(--tx); }
#side-nav { display: flex; flex-direction: column; gap: 3px; flex: 1; overflow: auto; }
.nav-section {
  font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--mu-2); padding: 14px 12px 8px;
}
#side-nav button {
  display: flex; align-items: center; gap: 11px;
  width: 100%; text-align: left;
  padding: 11px 12px; border-radius: var(--radius-sm);
  color: var(--tx-2); font-weight: 550; font-size: 0.92rem;
  transition: background .15s, color .15s, box-shadow .15s;
}
#side-nav button:hover { background: var(--surface-3); color: var(--tx); }
#side-nav button[aria-current="page"] {
  background: var(--em-soft); color: var(--em-deep);
  box-shadow: inset 3px 0 0 var(--em);
  font-weight: 650;
}
[data-theme="dark"] #side-nav button[aria-current="page"] { color: var(--em); }
#side-nav button svg { opacity: 0.88; }
.side-foot { border-top: 1px solid var(--bd); padding-top: 12px; margin-top: 10px; display: flex; flex-direction: column; gap: 2px; }
.side-link {
  text-align: left; padding: 9px 12px; border-radius: var(--radius-xs);
  color: var(--mu); font-size: 0.86rem; font-weight: 500;
}
.side-link:hover { background: var(--surface-3); color: var(--tx); }

.main-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  height: var(--top-h);
  display: flex; align-items: center; gap: 10px;
  padding: 0 16px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--bd);
  position: sticky; top: 0; z-index: 30;
}
.search-btn {
  flex: 1; max-width: 420px;
  display: flex; align-items: center; gap: 8px;
  padding: 9px 12px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--bd);
  color: var(--mu); font-size: 0.88rem;
  transition: border-color .15s, box-shadow .15s;
}
.search-btn:hover { border-color: var(--bd-strong); box-shadow: var(--shadow-xs); }
.search-btn kbd {
  margin-left: auto; font-size: 0.72rem; font-weight: 600;
  padding: 2px 7px; border-radius: 6px;
  background: var(--surface); border: 1px solid var(--bd); color: var(--mu-2);
}
.icon-btn {
  width: 40px; height: 40px; border-radius: 12px;
  display: grid; place-items: center; position: relative;
  color: var(--tx-2); border: 1px solid transparent;
  transition: background .15s, border-color .15s;
}
.icon-btn:hover { background: var(--surface-2); border-color: var(--bd); }
.icon-btn .dot {
  position: absolute; top: 9px; right: 9px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--bad); box-shadow: 0 0 0 2px var(--surface);
}
.sync-badge {
  font-size: 0.72rem; font-weight: 650; letter-spacing: 0.02em;
  padding: 4px 9px; border-radius: 999px;
  background: var(--surface-2); color: var(--mu); border: 1px solid var(--bd);
}
.sync-badge.online { background: var(--em-soft); color: var(--em-deep); border-color: color-mix(in srgb, var(--em) 25%, var(--bd)); }
[data-theme="dark"] .sync-badge.online { color: var(--em); }

.content {
  flex: 1; width: 100%; max-width: var(--content-max);
  margin: 0 auto; padding: 18px 16px 100px;
}
@media (min-width: 960px) { .content { padding: 24px 28px 40px; } }

.page-title {
  display: flex; align-items: flex-start; justify-content: space-between; gap: 12px;
  margin-bottom: 16px; flex-wrap: wrap;
}
.page-title h1 { margin: 0; }
.page-title .muted { margin: 4px 0 0; font-size: 0.9rem; }

/* Cards & stats */
.card {
  background: var(--surface);
  border: 1px solid var(--bd);
  border-radius: var(--radius);
  padding: 16px 18px;
  margin-bottom: 12px;
  box-shadow: var(--shadow-sm);
}
.card.gold {
  background: linear-gradient(135deg, var(--gold-soft), var(--surface));
  border-color: color-mix(in srgb, var(--gold) 28%, var(--bd));
}
.card-head {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-bottom: 10px;
}
.card-head h3 { margin: 0; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(148px, 1fr));
  gap: 10px; margin-bottom: 12px;
}
.grid-2 { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 720px) { .grid-2 { grid-template-columns: 1fr 1fr; } }
.stat {
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--bd);
  border-radius: var(--radius);
  padding: 14px 14px 12px;
  box-shadow: var(--shadow-xs);
  transition: border-color .15s, box-shadow .15s, transform .12s;
}
button.stat:hover, button.stat:focus-visible {
  border-color: color-mix(in srgb, var(--em) 35%, var(--bd));
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}
.stat .lbl {
  font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: 0.05em; color: var(--mu); margin-bottom: 6px;
}
.stat .val {
  font-size: 1.25rem; font-weight: 750; letter-spacing: -0.03em;
  font-variant-numeric: tabular-nums; color: var(--tx); line-height: 1.2;
}
.stat .sub { font-size: 0.75rem; color: var(--mu); margin-top: 5px; line-height: 1.35; }
.val.ok { color: var(--ok); }
.val.bad { color: var(--bad); }
.val.est { color: var(--tx-2); }
.lbl { font-size: 0.78rem; font-weight: 650; color: var(--mu); text-transform: uppercase; letter-spacing: 0.04em; }

/* Buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 14px; border-radius: var(--radius-sm);
  font-weight: 650; font-size: 0.9rem; line-height: 1.2;
  border: 1px solid transparent;
  transition: background .15s, border-color .15s, box-shadow .15s, transform .1s;
}
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: linear-gradient(180deg, color-mix(in srgb, var(--em) 92%, white), var(--em));
  color: #fff; box-shadow: 0 1px 2px rgba(11,122,75,0.25), inset 0 1px 0 rgba(255,255,255,0.15);
}
.btn-primary:hover { background: var(--em-hover); }
.btn-secondary {
  background: var(--surface); color: var(--tx-2);
  border-color: var(--bd-strong); box-shadow: var(--shadow-xs);
}
.btn-secondary:hover { background: var(--surface-2); border-color: var(--mu-2); }
.btn-ghost { color: var(--tx-2); background: transparent; }
.btn-ghost:hover { background: var(--surface-2); }
.btn-ai {
  background: linear-gradient(135deg, #0f766e, var(--em));
  color: #fff;
}
.btn-sm { padding: 7px 11px; font-size: 0.82rem; border-radius: var(--radius-xs); }
.btn-block { width: 100%; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

/* Forms */
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.field > span { font-size: 0.8rem; font-weight: 650; color: var(--tx-2); }
.field input, .field select, .field textarea,
input[type="text"], input[type="password"], input[type="email"], input[type="number"],
input[type="date"], input[type="tel"], select, textarea {
  width: 100%; padding: 11px 12px;
  border: 1px solid var(--bd-strong); border-radius: var(--radius-sm);
  background: var(--surface); color: var(--tx);
  transition: border-color .15s, box-shadow .15s;
}
.field input:focus, .field select:focus, .field textarea:focus,
input:focus, select:focus, textarea:focus {
  outline: none;
  border-color: var(--em);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--em) 18%, transparent);
}
.row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 0; border-bottom: 1px solid var(--bd);
}
.row:last-child { border-bottom: none; }

/* Pills / tags */
.pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 14px; }
.pill {
  padding: 7px 12px; border-radius: 999px;
  border: 1px solid var(--bd-strong); background: var(--surface);
  color: var(--tx-2); font-size: 0.82rem; font-weight: 600;
  transition: all .15s;
}
.pill:hover { border-color: var(--em-muted); color: var(--em); background: var(--em-soft); }
.pill.active {
  background: var(--em); color: #fff; border-color: var(--em);
  box-shadow: 0 2px 8px rgba(11,122,75,0.25);
}
.pill.active:hover { background: var(--em-hover); border-color: var(--em-hover); color: #fff; }
.tag {
  display: inline-flex; align-items: center;
  padding: 3px 8px; border-radius: 999px;
  font-size: 0.72rem; font-weight: 700;
  background: var(--em-soft); color: var(--em-deep);
}
[data-theme="dark"] .tag { color: var(--em); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.w { background: var(--gold-soft); color: var(--gold); }
.tag.muted { background: var(--surface-2); color: var(--mu); }

/* Tables */
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tbl, table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
.tbl th, .tbl td, table th, table td {
  padding: 10px 8px; text-align: left;
  border-bottom: 1px solid var(--bd);
}
.tbl th, table th {
  color: var(--mu); font-weight: 700; font-size: 0.72rem;
  text-transform: uppercase; letter-spacing: 0.04em;
}
.tbl .n, table .n { text-align: right; font-variant-numeric: tabular-nums; }
.tbl .bad, table .bad { color: var(--bad); }
.tbl .ok, table .ok { color: var(--ok); }

/* Tabs */
.tabs-line {
  display: flex; gap: 4px; overflow-x: auto;
  margin-bottom: 14px; padding-bottom: 2px;
  border-bottom: 1px solid var(--bd);
}
.tabs-line button {
  padding: 10px 12px; white-space: nowrap;
  color: var(--mu); font-weight: 600; font-size: 0.88rem;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.tabs-line button[aria-selected="true"] {
  color: var(--em); border-bottom-color: var(--em);
}

/* Alerts */
.alert-item {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 0; border-bottom: 1px solid var(--bd);
}
.alert-item:last-child { border-bottom: none; }
.alert-icon {
  width: 28px; height: 28px; border-radius: 8px;
  display: grid; place-items: center; flex-shrink: 0;
  background: var(--gold-soft); color: var(--gold); font-weight: 800; font-size: 0.85rem;
}
.alert-icon.bad { background: var(--bad-soft); color: var(--bad); }

/* Charts */
.chart-wrap { height: 148px; margin: 4px 0; }
.chart-wrap svg { width: 100%; height: 100%; }

/* Bottom nav / FAB */
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  height: calc(var(--nav-h) + var(--safe-b));
  padding-bottom: var(--safe-b);
  display: grid; grid-template-columns: repeat(5, 1fr);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--bd);
  box-shadow: 0 -8px 24px rgba(15,23,42,0.04);
}
@media (min-width: 960px) { .bottom-nav { display: none; } }
.bottom-nav button {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--mu); font-size: 0.68rem; font-weight: 650; padding-top: 6px;
}
.bottom-nav button[aria-current="page"] { color: var(--em); }
.fab {
  position: fixed; right: 18px; bottom: calc(var(--nav-h) + var(--safe-b) + 14px);
  width: 56px; height: 56px; border-radius: 18px;
  background: linear-gradient(180deg, color-mix(in srgb, var(--em) 90%, white), var(--em));
  color: #fff; font-size: 1.6rem; font-weight: 500;
  box-shadow: 0 10px 24px rgba(11,122,75,0.35);
  z-index: 45; display: grid; place-items: center;
}
@media (min-width: 960px) { .fab { bottom: 28px; } }

/* Auth / overlays */
#auth, #sublock {
  position: fixed; inset: 0; z-index: 200;
  background:
    radial-gradient(800px 400px at 50% 0%, rgba(11,122,75,0.1), transparent 60%),
    var(--bg);
  overflow: auto; display: flex; padding: 20px;
}
#auth[hidden], #sublock[hidden] { display: none; }
body.locked .app-shell, body.locked .bottom-nav, body.locked .fab { display: none; }
#auth .card, #sublock .card {
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--bd);
}

/* Chat / AI */
.chat { display: flex; flex-direction: column; gap: 10px; max-height: 360px; overflow: auto; margin-bottom: 12px; }
.bubble {
  padding: 12px 14px; border-radius: 14px; max-width: 92%;
  line-height: 1.45; font-size: 0.92rem;
}
.bubble.user {
  align-self: flex-end;
  background: var(--em); color: #fff;
  border-bottom-right-radius: 4px;
}
.bubble.ai {
  align-self: flex-start;
  background: var(--surface-2); border: 1px solid var(--bd);
  border-bottom-left-radius: 4px;
}
.cite { display: block; margin-top: 6px; font-size: 0.75rem; opacity: 0.8; }
.chat-input-row { display: flex; gap: 8px; }
.chat-input-row input {
  flex: 1; padding: 12px 14px; border-radius: 999px;
  border: 1px solid var(--bd-strong); background: var(--surface);
}

/* Misc */
.lock-note { font-size: 0.8rem; color: var(--mu); margin: 8px 0 0; line-height: 1.4; }
.empty { text-align: center; padding: 28px 12px; color: var(--mu); }
.empty h3 { color: var(--tx-2); }
.help-panel {
  background: var(--surface-2); border: 1px solid var(--bd);
  border-radius: var(--radius-sm); padding: 12px; margin: 10px 0;
}
.cap-list { margin: 0; padding-left: 18px; font-size: 0.9rem; line-height: 1.55; }
.cap-list li { margin-bottom: 6px; }
details.card summary {
  cursor: pointer; font-weight: 650; list-style: none;
}
details.card summary::-webkit-details-marker { display: none; }
details.card[open] summary { margin-bottom: 12px; }
.toast {
  position: fixed; left: 50%; bottom: calc(var(--nav-h) + 20px);
  transform: translateX(-50%);
  background: var(--tx); color: var(--surface);
  padding: 12px 16px; border-radius: 12px; z-index: 300;
  box-shadow: var(--shadow-lg); font-weight: 550; max-width: 90vw;
}
[data-theme="dark"] .toast { background: #f8fafc; color: #0f172a; }

/* Command palette */
#cmd-overlay, .modal-backdrop {
  position: fixed; inset: 0; z-index: 180;
  background: rgba(15,23,42,0.45); backdrop-filter: blur(4px);
  display: flex; align-items: flex-start; justify-content: center;
  padding: 12vh 16px 16px;
}
.cmd-panel, .modal {
  width: 100%; max-width: 520px;
  background: var(--surface); border: 1px solid var(--bd);
  border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden;
}
.cmd-panel input {
  width: 100%; padding: 16px 18px; border: none; border-bottom: 1px solid var(--bd);
  background: transparent; font-size: 1rem;
}
.cmd-item {
  width: 100%; text-align: left; padding: 12px 18px;
  display: flex; justify-content: space-between; gap: 12px;
