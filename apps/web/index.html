<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a6847">
<meta name="description" content="Business management and financial intelligence for Kenyan SMEs">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>MarginPilot</title>
<style>
:root {
  --em: #0a6847; --em-hover: #085538; --em-soft: #dcefe5;
  --gold: #9a6f12; --gold-soft: #f6ecd2;
  --bg: #f4f6f1; --surface: #ffffff; --surface-2: #eef1eb;
  --tx: #12221a; --mu: #55635b; --bd: #d9dfd6;
  --bad: #a8281f; --bad-soft: #f8e1de; --warn: #9a6f12; --ok: #0a6847;
  --radius: 12px; --radius-sm: 8px; --space: 8px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --shadow: 0 1px 2px rgba(18,34,26,.06), 0 4px 12px rgba(18,34,26,.04);
  --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --nav-h: 64px; --side-w: 240px; color-scheme: light;
}
[data-theme="dark"] {
  --em: #4cc38a; --em-hover: #3aa875; --em-soft: #173a2a;
  --gold: #e0b24f; --gold-soft: #3a2f13;
  --bg: #0d1511; --surface: #15201a; --surface-2: #1c2a23;
  --tx: #e8efe9; --mu: #9fb0a6; --bd: #27352d;
  --bad: #ff8a80; --bad-soft: #3d1d1a; --warn: #e0b24f; --ok: #4cc38a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 12px rgba(0,0,0,.2); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 16px/1.5 var(--font); background: var(--bg); color: var(--tx); -webkit-font-smoothing: antialiased; padding-top: var(--safe-t); }
h1,h2,h3,h4 { margin: 0 0 var(--space); font-weight: 600; letter-spacing: -0.02em; }
h1 { font-size: 1.5rem; } h2 { font-size: 1.25rem; } h3 { font-size: 1.05rem; }
p { margin: 0 0 var(--space); } a { color: var(--em); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; padding: 0; }
:focus-visible { outline: 3px solid var(--em); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
.skip-link { position: absolute; left: -9999px; top: 0; z-index: 1000; background: var(--em); color: #fff; padding: 12px 16px; border-radius: var(--radius-sm); }
.skip-link:focus { left: 12px; top: 12px; }
.app-shell { display: flex; min-height: 100%; }
.sidebar { display: none; width: var(--side-w); background: var(--surface); border-right: 1px solid var(--bd); flex-direction: column; padding: calc(var(--space)*2); position: sticky; top: 0; height: 100vh; height: 100dvh; }
.sidebar .brand { display: flex; align-items: center; gap: 12px; padding: 8px 8px 20px; color: var(--em); font-weight: 700; font-size: 1.15rem; }
.sidebar nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
.sidebar nav button, .side-link { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--radius-sm); color: var(--tx); text-align: left; min-height: 44px; font-size: 0.95rem; font-weight: 500; }
.sidebar nav button[aria-current="page"], .side-link[aria-current="page"] { background: var(--em-soft); color: var(--em); }
.sidebar nav button:hover, .side-link:hover { background: var(--surface-2); }
.sidebar .side-foot { padding-top: 12px; border-top: 1px solid var(--bd); display: flex; flex-direction: column; gap: 4px; }
.main-wrap { flex: 1; display: flex; flex-direction: column; min-width: 0; padding-bottom: calc(var(--nav-h) + var(--safe-b) + 16px); }
.topbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--bd); position: sticky; top: 0; z-index: 20; }
.topbar .search-btn { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--surface-2); border: 1px solid var(--bd); border-radius: 999px; padding: 10px 14px; min-height: 44px; color: var(--mu); text-align: left; font-size: 0.95rem; }
.topbar .icon-btn { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); border: 1px solid var(--bd); color: var(--tx); }
.content { flex: 1; max-width: 1100px; width: 100%; margin: 0 auto; padding: 16px; }
.bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b); background: var(--surface); border-top: 1px solid var(--bd); display: flex; justify-content: space-around; align-items: center; z-index: 30; }
.bottom-nav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px; min-height: 48px; color: var(--mu); font-size: 0.7rem; font-weight: 500; }
.bottom-nav button[aria-current="page"] { color: var(--em); }
.bottom-nav svg { width: 22px; height: 22px; }
.fab { position: fixed; right: 16px; bottom: calc(var(--nav-h) + var(--safe-b) + 16px); width: 56px; height: 56px; border-radius: 50%; background: var(--em); color: #fff; display: grid; place-items: center; box-shadow: var(--shadow), 0 4px 16px rgba(10,104,71,.35); z-index: 25; font-size: 1.5rem; font-weight: 600; }
.fab:hover { background: var(--em-hover); }
.fab[hidden] { display: none; }
@media (min-width: 900px) {
  .sidebar { display: flex; }
  .bottom-nav { display: none; }
  .main-wrap { padding-bottom: 24px; }
  .fab { bottom: 24px; right: 24px; }
}
.card { background: var(--surface); border: 1px solid var(--bd); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
.card.gold { border-color: var(--gold); background: var(--gold-soft); }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 12px; }
.stat { background: var(--surface); border: 1px solid var(--bd); border-radius: var(--radius); padding: 14px; cursor: pointer; text-align: left; min-height: 88px; transition: border-color .15s ease; }
.stat:hover, .stat:focus-visible { border-color: var(--em); }
.stat .lbl { color: var(--mu); font-size: 0.8rem; font-weight: 500; margin-bottom: 4px; }
.stat .val { font-size: 1.35rem; font-weight: 650; letter-spacing: -0.02em; line-height: 1.2; }
.stat .sub { font-size: 0.75rem; color: var(--mu); margin-top: 4px; }
.val.ok { color: var(--ok); } .val.bad { color: var(--bad); } .val.est { opacity: 0.85; }
.tag { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 0.72rem; font-weight: 600; background: var(--em-soft); color: var(--em); }
.tag.w { background: var(--gold-soft); color: var(--gold); } .tag.b { background: var(--bad-soft); color: var(--bad); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 10px 16px; border-radius: var(--radius-sm); font-weight: 600; font-size: 0.95rem; border: 1px solid transparent; transition: background .12s ease; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--em); color: #fff; } .btn-primary:hover:not(:disabled) { background: var(--em-hover); }
.btn-secondary { background: transparent; border-color: var(--bd); color: var(--tx); } .btn-secondary:hover:not(:disabled) { background: var(--surface-2); }
.btn-ghost { color: var(--em); } .btn-sm { min-height: 36px; padding: 6px 12px; font-size: 0.85rem; }
label.field { display: block; margin-bottom: 12px; }
label.field > span { display: block; font-size: 0.85rem; font-weight: 500; color: var(--mu); margin-bottom: 4px; }
input[type="text"], input[type="number"], input[type="search"], input[type="password"], input[inputmode], select, textarea {
  width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--bd); border-radius: var(--radius-sm); background: var(--surface); color: var(--tx);
}
textarea { min-height: 96px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--em); outline: none; box-shadow: 0 0 0 3px var(--em-soft); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--bd); }
.row:last-child { border-bottom: none; }
.prod-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
.prod-tile { background: var(--surface-2); border: 1px solid var(--bd); border-radius: var(--radius-sm); padding: 12px 8px; text-align: center; min-height: 88px; font-size: 0.9rem; }
.prod-tile:disabled { opacity: 0.45; } .prod-tile b { display: block; margin-bottom: 4px; } .prod-tile small { color: var(--mu); }
.period-switch { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; }
.period-switch button { padding: 8px 14px; border-radius: 999px; min-height: 36px; border: 1px solid var(--bd); background: var(--surface); font-size: 0.85rem; font-weight: 500; white-space: nowrap; }
.period-switch button[aria-pressed="true"] { background: var(--em); color: #fff; border-color: var(--em); }
.chart-wrap { height: 160px; position: relative; margin: 8px 0 4px; }
.chart-wrap svg { width: 100%; height: 100%; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid var(--bd); }
th { color: var(--mu); font-weight: 600; font-size: 0.8rem; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.empty { text-align: center; padding: 32px 16px; color: var(--mu); } .empty h3 { color: var(--tx); margin-bottom: 8px; }
.toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + var(--safe-b) + 72px); transform: translateX(-50%); background: var(--tx); color: var(--bg); padding: 12px 18px; border-radius: 999px; font-size: 0.9rem; font-weight: 500; z-index: 50; max-width: 90vw; box-shadow: var(--shadow); animation: fadeIn .2s ease; }
[data-theme="dark"] .toast { background: var(--em); color: #0d1511; }
@keyframes fadeIn { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }
.overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; display: flex; align-items: flex-start; justify-content: center; padding: 10vh 16px 16px; }
.cmd { width: 100%; max-width: 520px; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--bd); box-shadow: var(--shadow); overflow: hidden; }
.cmd input { border: none; border-bottom: 1px solid var(--bd); border-radius: 0; font-size: 1.05rem; padding: 16px; }
.cmd input:focus { box-shadow: none; }
.cmd-list { max-height: 320px; overflow-y: auto; }
.cmd-item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 16px; text-align: left; min-height: 48px; }
.cmd-item:hover, .cmd-item[aria-selected="true"] { background: var(--em-soft); }
.modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 80; display: flex; align-items: flex-end; justify-content: center; }
@media (min-width: 600px) { .modal-backdrop { align-items: center; } }
.modal { background: var(--surface); width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 20px; border: 1px solid var(--bd); }
@media (min-width: 600px) { .modal { border-radius: var(--radius); } }
.modal-actions { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
.keypad button { min-height: 52px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--bd); font-size: 1.25rem; font-weight: 600; }
.keypad button.wide { grid-column: span 2; }
.sync-badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: var(--gold-soft); color: var(--gold); font-size: 0.75rem; font-weight: 600; }
.sync-badge.online { background: var(--em-soft); color: var(--em); }
.lock-note { font-size: 0.8rem; color: var(--mu); margin-top: 4px; }
.receipt { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.85rem; white-space: pre-wrap; background: var(--surface-2); padding: 16px; border-radius: var(--radius-sm); }
.help-panel { border-left: 3px solid var(--em); padding-left: 12px; margin: 8px 0; font-size: 0.9rem; }
.bad { color: var(--bad); } .ok { color: var(--ok); }
</style>
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<div class="app-shell">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M8 24V8h3.5l4.5 8 4.5-8H24v16h-3.2V13.5L16.8 21h-1.6L11.2 13.5V24H8z" fill="var(--bg)"/></svg>
      <span class="brand-text">MarginPilot</span>
    </div>
    <nav id="side-nav"></nav>
    <div class="side-foot">
      <button type="button" class="side-link" id="side-theme" aria-label="Toggle dark mode">Theme</button>
      <button type="button" class="side-link" id="side-cmd" aria-label="Open command menu">Search (Ctrl+K)</button>
    </div>
  </aside>
  <div class="main-wrap">
    <header class="topbar">
      <button type="button" class="search-btn" id="search-open" aria-label="Search and commands">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="8" r="6"/><path d="M13 13l4 4"/></svg>
        <span>Search products, sales…</span>
      </button>
      <span id="sync-status" class="sync-badge online" title="Connection status">Online</span>
      <button type="button" class="icon-btn" id="theme-btn" aria-label="Toggle theme">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </header>
    <main class="content" id="main" tabindex="-1"></main>
  </div>
</div>
<nav class="bottom-nav" id="bottom-nav" aria-label="Primary"></nav>
<button type="button" class="fab" id="fab-sale" aria-label="New sale" title="New sale">+</button>
<div id="overlays"></div>
<script src="app.js"></script>
</body>
</html>
